name: taskflow-monitoring

services:
  prometheus:
    image: docker.io/prom/prometheus:v3.4.0
    container_name: taskflow-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - "9091:9090"
    restart: unless-stopped

  blackbox:
    image: docker.io/prom/blackbox-exporter:v0.25.0
    container_name: taskflow-blackbox
    restart: unless-stopped

  alertmanager:
    image: docker.io/prom/alertmanager:v0.28.1
    container_name: taskflow-alertmanager
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"
    restart: unless-stopped

  mailpit:
    image: docker.io/axllent/mailpit:v1.22
    container_name: taskflow-mailpit
    ports:
      - "9025:8025"   # interface web
      - "9026:1025"   # SMTP
    restart: unless-stopped

  grafana:
    image: docker.io/grafana/grafana:11.6.1
    container_name: taskflow-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:

networks:
  default:
    name: taskflow-staging
    external: true
