global:
  smtp_smarthost: "mailpit:1025"
  smtp_from: "alertmanager@taskflow.local"
  smtp_require_tls: false

route:
  receiver: email
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 1h

receivers:
  - name: email
    email_configs:
      - to: "equipe@taskflow.local"
        send_resolved: true

inhibit_rules:
  - source_matchers: [severity="critical"]
    target_matchers: [severity="warning"]
    equal: [alertname]
