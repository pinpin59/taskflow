# ============================================================================
# compose.prod.yaml : la « production » de TaskFlow (projet Compose taskflow-prod).
#
# Elle vit dans son propre dossier, PROD_DIR (défaut : ~/taskflow-prod), qui joue
# le rôle du serveur. On y trouve :
#   - les fichiers VERSIONNÉS, copiés par le pipeline : compose.prod.yaml,
#     nginx/taskflow.conf, deploy.sh, smoke-test.sh, backup.sh, gen-cert.sh ;
#   - ce qui n'existe QUE là, jamais dans Git : .env (secrets), certs/, backups/.
#
# Différences avec compose.yaml (développement) :
#   - pas de `build:` : on tire les images construites, scannées et publiées par
#     release.yml (build once, deploy many : la même image est passée par staging) ;
#   - IMAGE_TAG (SHA court) choisit la version qui tourne ;
#   - la configuration vient de l'environnement (.env), pas du code (12-factor) ;
#   - un service `proxy` (Nginx, HTTPS) est le SEUL à publier des ports.
#
# Utilisation (dans PROD_DIR) :
#     ./deploy.sh <tag>                          # ce que fait aussi le pipeline
#     docker compose -f compose.prod.yaml ps
# ============================================================================

# Le nom du projet préfixe conteneurs et volumes (taskflow-prod-api-1...) :
# la prod ne se mélange ni avec le dev ni avec le staging, sur la même machine.
name: taskflow-prod

services:
  db:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: taskflow
      # ":?" = erreur explicite si la variable manque (plutôt qu'un mot de passe vide)
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
      POSTGRES_DB: taskflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow -d taskflow"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    image: ghcr.io/${GHCR_OWNER:?GHCR_OWNER manquant dans .env}/taskflow-api:${IMAGE_TAG:-latest}
    # Tout le .env est transmis (DATABASE_URL, APP_ENV...). Une DATABASE_URL absente
    # ou mal nommée fait retomber l'API sur localhost : voir docs/INCIDENTS.md.
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  front:
    image: ghcr.io/${GHCR_OWNER:?GHCR_OWNER manquant dans .env}/taskflow-front:${IMAGE_TAG:-latest}
    # Pas de `ports:` : le front n'est joignable que par le proxy, sur le réseau privé.
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # Reverse proxy : point d'entrée unique, termine le TLS, redirige HTTP -> HTTPS.
  proxy:
    image: docker.io/library/nginx:1.29-alpine
    # SEUL service qui publie des ports. Si 80/443 sont pris (ou Docker rootless) :
    # HTTP_PORT=8082 et HTTPS_PORT=8443 dans .env (8080 = dev, 8081 = staging).
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/taskflow.conf:/etc/nginx/conf.d/default.conf:ro
      # Certificat et clé privée (gen-cert.sh), JAMAIS dans Git
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      front:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/nginx-health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  pgdata:

# Réseau par défaut NOMMÉ explicitement : la stack de monitoring (Jour 4) le
# rejoint en `external: true` pour scraper api:3000/metrics sans rien exposer.
networks:
  default:
    name: taskflow-prod
