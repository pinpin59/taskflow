name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  COVERAGE_MIN: 75

jobs:
  api:
    name: api
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: [20, 22]
      fail-fast: false

    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Tests avec couverture
        run: npm run test:coverage

      - name: Vérification couverture
        run: |
          PCT=$(jq -r '.total.lines.pct' coverage/coverage-summary.json)
          echo "## Couverture de l'API (Node ${{ matrix.node }})" >> "$GITHUB_STEP_SUMMARY"
          echo "| Métrique | Couverture |" >> "$GITHUB_STEP_SUMMARY"
          echo "| -------- | ---------- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Lignes | ${PCT}% |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Instructions | $(jq -r '.total.statements.pct' coverage/coverage-summary.json)% |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Fonctions | $(jq -r '.total.functions.pct' coverage/coverage-summary.json)% |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Branches | $(jq -r '.total.branches.pct' coverage/coverage-summary.json)% |" >> "$GITHUB_STEP_SUMMARY"
          awk -v p="$PCT" -v min="$COVERAGE_MIN" 'BEGIN { if (p + 0 < min + 0) { print "::error title=Couverture insuffisante::lignes " p "% < " min "%" ; exit 1 } }'

  api-integration:
    name: api-integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgres://taskflow:taskflow@localhost:5432/taskflow
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: taskflow
          POSTGRES_PASSWORD: taskflow
          POSTGRES_DB: taskflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskflow -d taskflow"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Tests d'intégration
        run: npm run test:int

  front:
    name: front
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: front
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Upload artefact front-dist
        uses: actions/upload-artifact@v4
        with:
          name: front-dist
          path: front/dist/
          retention-days: 7
          if-no-files-found: error
